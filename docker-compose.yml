# Server (shared Postgres):  set POSTGRES_DOCKER_NETWORK in .env, then:
#   docker compose up -d --build   → http://localhost:4040
# First data load:  docker compose exec app npm run sync
#
# Local PostGIS sidecar:  docker compose --profile local up -d
#   (set DATABASE_URL host to `db`, and POSTGRES_DOCKER_NETWORK to any
#    existing/created network name — e.g. docker network create circolife-maps-net)

services:
  db:
    profiles: ["local"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: circomap
      POSTGRES_USER: circomap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circomap}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circomap -d circomap"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circolife-map-app
    ports:
      - "${APP_PUBLISH_PORT:-4040}:4000"
    env_file:
      - server/.env
    environment:
      # DATABASE_URL comes from server/.env (e.g. host circolife-ai-postgres)
      NODE_ENV: production
      WEB_DIST: /app/web/dist
      PORT: "4000"
    restart: unless-stopped
    networks:
      - default
      - postgres_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  postgres_net:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK}

volumes:
  dbdata:
